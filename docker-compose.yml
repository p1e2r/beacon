# Standalone: works with cloudflared anywhere (same compose, another container,
# another machine on your LAN, or installed on the host).
services:
  beacon:
    image: ghcr.io/p1e2r/beacon:latest
    # build: .            # or build it yourself from this folder
    container_name: beacon
    restart: unless-stopped
    volumes:
      - ./beacon-data:/data          # config.json + keys.json
    ports:
      # Players: the web client + WebSocket. Point your Cloudflare tunnel's public
      # hostname at http://<this-machine's-LAN-IP>:7320 (or http://localhost:7320
      # if cloudflared runs on this same machine).
      - "7320:7320"
      # Admin panel: open http://<this-machine's-LAN-IP>:9108 from home.
      # Never add this port to the tunnel or forward it on your router.
      - "9108:9108"
