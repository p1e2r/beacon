[package]
name = "beacon-proxy"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "Key-protected WebSocket proxy for the Beacon browser Minecraft client"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
hickory-resolver = "0.26.3"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
